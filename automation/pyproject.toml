[build-system]
requires = ["setuptools>=68", "wheel>=0.41"]
build-backend = "setuptools.build_meta"

[project]
name = "mecar-ansys-automation"
version = "0.1.0"
description = "Fail-closed single-PC analysis automation MVP for MECar"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = []

classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]

[project.scripts]
mecar-analysis = "mecar_automation.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mecar_automation = ["default_profiles/*.json"]

[tool.setuptools.data-files]
"share/mecar-ansys-automation/scripts" = ["scripts/*.ps1"]
